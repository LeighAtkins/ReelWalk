name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    # The outbox tests (packages/db) check row locking, so they need a real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reelwalk
          POSTGRES_PASSWORD: reelwalk
          POSTGRES_DB: reelwalk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reelwalk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://reelwalk:reelwalk@localhost:5432/reelwalk
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - name: Lint Helm chart
        run: |
          helm lint infra/helm/reelwalk
          helm lint infra/helm/reelwalk -f infra/helm/reelwalk/values-kind.yaml

  # Which of the slow checks this run needs (ADR 0054). Pushes to main run
  # everything; a PR runs the end-to-end suite only when it touches what the
  # suite drives: the web app, the domain and database packages, the suite,
  # the stack it starts (compose, nginx), dependencies, or this workflow. The
  # worker image's acceptance render (ADR 0053) runs when it touches the
  # renderer or the domain package.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.paths.outputs.e2e }}
      compare: ${{ steps.paths.outputs.compare }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            printf 'e2e=true\ncompare=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Renames count under both names. If the list cannot be read, run everything.
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)'); then
            printf 'e2e=true\ncompare=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          touches() { if printf '%s\n' "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          echo "e2e=$(touches '^(apps/web/|packages/(core|db)/|e2e/|infra/nginx/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|docker-compose(\.override)?\.yml$|\.github/workflows/ci\.yml$)')" | tee -a "$GITHUB_OUTPUT"
          echo "compare=$(touches '^packages/(render|core)/')" | tee -a "$GITHUB_OUTPUT"

  dependency-scan:
    name: Dependency and config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Trivy runs from its own image instead of a third-party action, so the
      # scanner version is pinned in one place (TRIVY_IMAGE).
      - name: Scan lockfile for known vulnerabilities
        run: >
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs /src
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      # Skipped: local-only stand-ins for AWS services. Accepted findings are
      # listed with reasons in .trivyignore.yaml.
      - name: Scan Dockerfiles and the Helm chart for misconfiguration
        run: >
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config .
          --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs infra/k8s/local
          --ignorefile .trivyignore.yaml

  images:
    name: Build and scan ${{ matrix.app }} image
    runs-on: ubuntu-latest
    needs: [verify, changes]
    permissions:
      contents: read
      # Lets the job request a short-lived AWS token through OIDC.
      id-token: write
      # Lets the job push to GitHub Container Registry with GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, worker]
    env:
      IMAGE: reelwalk-${{ matrix.app }}:${{ github.sha }}
      # The worker smoke's acceptance checks (ADR 0053), on main and on PRs that touch the renderer or core (ADR 0054).
      SMOKE_COMPARE: ${{ (needs.changes.outputs.compare != 'true' || contains(github.event.pull_request.labels.*.name, 'skip-acceptance') || vars.SKIP_ACCEPTANCE == 'true') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Draw the first and last frame of every shot of a reel that uses every
      # feature, with the renderer this image ships (ADR 0042). A frame that
      # errors or hangs fails here, not in a production export.
      # Then the acceptance checks (ADR 0053): the exported frames must match
      # stills of the same frames (preview matches export), and every planar
      # title must stay on its plane. To skip them when the fixture or the
      # renderer is unavailable, label the PR `skip-acceptance` (then push, so
      # the run sees the label) or set the repository variable
      # SKIP_ACCEPTANCE=true. The baseline comparison only reports here: its
      # references were made on Windows (packages/render/fixtures/SOURCE.md).
      # The acceptance checks take most of this step's time, so they run on
      # pushes to main and on PRs that touch packages/render or packages/core
      # (the "What changed" job); other PRs get the plain smoke (ADR 0054).
      - name: Render smoke test
        if: matrix.app == 'worker'
        timeout-minutes: ${{ env.SMOKE_COMPARE == '1' && 25 || 10 }}
        # From the worker's directory: that is where the image's Chrome lives
        # (ensure-browser ran there) and the only node_modules the `node` user may write.
        run: |
          mkdir -p smoke-out && chmod 777 smoke-out
          docker run --rm -w /workspace/apps/worker -e SMOKE_COMPARE -e SMOKE_BASELINE=report -v "$PWD/smoke-out:/out" "$IMAGE" node_modules/.bin/tsx ../../packages/render/scripts/render-smoke.ts /out
      # Walk the block (ADR 0093): the drone solve's tests (a real 4 s fixture, refusals) with the image's own Python and OpenCV.
      - name: Drone solve tests
        if: matrix.app == 'worker'
        timeout-minutes: 5
        run: docker run --rm -w /workspace/apps/worker/block "$IMAGE" /opt/block/bin/python -m unittest discover -s tests -v
      # Render QA (ADR 0082), report only: remotion-qa's pace and Reels safe-zone checks on the smoke's MP4, and
      # audio-bed-check's loop and level-step checks on the bundled ambience beds. Its findings go to the job summary;
      # it does not fail the build (the beds are known 4 s loops, and the safe-zone check skips bands over footage).
      - name: Render QA (report only)
        if: always() && matrix.app == 'worker'
        continue-on-error: true
        timeout-minutes: 6
        run: bash packages/render/scripts/qa/render-qa.sh smoke-out
      # The stills, the MP4 and the contact sheets, to look at (and to take new baseline references from).
      - name: Keep the smoke's frames
        if: always() && matrix.app == 'worker'
        uses: actions/upload-artifact@v7
        with:
          name: render-acceptance
          path: smoke-out
          if-no-files-found: ignore

      # Accepted findings (with reasons) are listed in .trivyignore.yaml.
      - name: Scan image with Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" "$TRIVY_IMAGE" image "$IMAGE"
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile /src/.trivyignore.yaml

      # Only scanned images are pushed. GHCR needs no setup: the job's own
      # token is the credential. The tag is the commit SHA, so a tag never
      # changes meaning and a rollback is a Git revert.
      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_IMAGE: ghcr.io/leighatkins/reelwalk-${{ matrix.app }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE" "$GHCR_IMAGE:${{ github.sha }}"
          docker push "$GHCR_IMAGE:${{ github.sha }}"

      # Pushing to ECR as well uses the GitHub OIDC role from infra/terraform
      # (repository variables AWS_ROLE_ARN and AWS_REGION). Without them the
      # steps are skipped, so forks still build.
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image to ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag "$IMAGE" "$REGISTRY/$IMAGE"
          docker push "$REGISTRY/$IMAGE"

  # GitOps hand-off: CI never touches the cluster. It records the new image tag
  # in Git, and Argo CD (infra/argocd) notices the commit and rolls it out.
  release:
    name: Record image tag for Argo CD
    runs-on: ubuntu-latest
    needs: [images, e2e, dependency-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Point the GitOps values at this commit's images
        run: |
          cat > infra/helm/reelwalk/values-gitops.yaml <<EOF
          # Written by the "release" job in .github/workflows/ci.yml. Do not edit
          # by hand: to roll back, revert the commit that changed this file.
          web:
            image:
              repository: ghcr.io/leighatkins/reelwalk-web
              tag: "${GITHUB_SHA}"
          worker:
            image:
              repository: ghcr.io/leighatkins/reelwalk-worker
              tag: "${GITHUB_SHA}"
          EOF
      # A push made with GITHUB_TOKEN does not start another workflow run, so
      # this commit cannot loop.
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/helm/reelwalk/values-gitops.yaml
          git commit -m "release: deploy ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [verify, changes]
    # A normal run takes 4 minutes; a stuck runner should not hold the PR for 6 hours.
    timeout-minutes: 30
    # A PR that touches nothing the suite drives (docs, ADRs, the worker or the
    # renderer alone: the worker image's smoke covers those) skips the steps,
    # and the job still reports success, so branch checks and ship.sh, which
    # wait on "End-to-end tests", read it as passed (ADR 0054).
    env:
      RUN: ${{ needs.changes.outputs.e2e }}
    steps:
      - name: Nothing the suite covers changed
        if: env.RUN != 'true'
        run: |
          echo "End-to-end tests skipped: this PR changes nothing under the paths in the 'What changed' job (ADR 0054)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: pnpm/action-setup@v6
        if: env.RUN == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.RUN == 'true'
      # Once hung for 37 minutes downloading on the runner. The Azure apt
      # mirror also crawls on some days (2026-10-22: main and PR #219 both spent
      # the whole 8 minutes on the 20 MB of CJK fonts --with-deps adds, while
      # every library Chromium needs was already on the runner). So: fetch the
      # browser from Playwright's CDN, prove it launches, and only then fall back
      # to apt for the system packages, with a 10 s per-fetch cap and retries.
      - name: Install Chromium for Playwright
        if: env.RUN == 'true'
        timeout-minutes: 8
        run: |
          launches() {
            pnpm --filter @reelwalk/e2e exec node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"
          }
          for attempt in 1 2 3; do
            pnpm --filter @reelwalk/e2e exec playwright install chromium && break
            echo "playwright install attempt $attempt failed; retrying"
          done
          if launches; then
            echo "Chromium launches with the runner's own libraries; skipping apt."
            exit 0
          fi
          echo "Chromium would not launch; installing its system packages."
          sudo tee /etc/apt/apt.conf.d/99-ci-fast-fail >/dev/null <<'APT'
          Acquire::http::Timeout "10";
          Acquire::https::Timeout "10";
          Acquire::Retries "3";
          APT
          for attempt in 1 2 3; do
            pnpm --filter @reelwalk/e2e exec playwright install-deps chromium && launches && exit 0
            echo "playwright install-deps attempt $attempt failed; retrying"
          done
          exit 1
      - name: Start the stack
        if: env.RUN == 'true'
        run: |
          docker compose up -d --build
          curl --fail --silent --retry 60 --retry-delay 2 --retry-all-errors http://localhost:8080/api/ready
      - run: pnpm e2e
        if: env.RUN == 'true'
        env:
          CI: "true"
      # Retries stay at one, but a pass on the retry is not silent: each such
      # test is listed as "flaky: <spec>" in the job summary (ADR 0054).
      - name: List flaky tests
        if: always() && env.RUN == 'true'
        run: node e2e/report-flaky.mjs e2e/test-results/results.json
      # Screenshots specs write as evidence (e.g. Inspect's zoomed frames, ADR 0057), kept on a pass too.
      - uses: actions/upload-artifact@v7
        if: always() && env.RUN == 'true'
        with:
          name: e2e-screenshots
          path: e2e/test-results/inspect-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure
          path: |
            compose-logs.txt
            e2e/playwright-report
            e2e/test-results
