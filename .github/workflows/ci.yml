name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    # The outbox tests (packages/db) check row locking, so they need a real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reelwalk
          POSTGRES_PASSWORD: reelwalk
          POSTGRES_DB: reelwalk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reelwalk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://reelwalk:reelwalk@localhost:5432/reelwalk
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - name: Lint Helm chart
        run: |
          helm lint infra/helm/reelwalk
          helm lint infra/helm/reelwalk -f infra/helm/reelwalk/values-kind.yaml

  dependency-scan:
    name: Dependency and config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Trivy runs from its own image instead of a third-party action, so the
      # scanner version is pinned in one place (TRIVY_IMAGE).
      - name: Scan lockfile for known vulnerabilities
        run: >
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs /src
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      # Skipped: local-only stand-ins for AWS services. Accepted findings are
      # listed with reasons in .trivyignore.yaml.
      - name: Scan Dockerfiles and the Helm chart for misconfiguration
        run: >
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config .
          --severity HIGH,CRITICAL --exit-code 1
          --skip-dirs infra/k8s/local
          --ignorefile .trivyignore.yaml

  images:
    name: Build and scan ${{ matrix.app }} image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      # Lets the job request a short-lived AWS token through OIDC.
      id-token: write
      # Lets the job push to GitHub Container Registry with GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, worker]
    env:
      IMAGE: reelwalk-${{ matrix.app }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Accepted findings (with reasons) are listed in .trivyignore.yaml.
      - name: Scan image with Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" "$TRIVY_IMAGE" image "$IMAGE"
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile /src/.trivyignore.yaml

      # Only scanned images are pushed. GHCR needs no setup: the job's own
      # token is the credential. The tag is the commit SHA, so a tag never
      # changes meaning and a rollback is a Git revert.
      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_IMAGE: ghcr.io/leighatkins/reelwalk-${{ matrix.app }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE" "$GHCR_IMAGE:${{ github.sha }}"
          docker push "$GHCR_IMAGE:${{ github.sha }}"

      # Pushing to ECR as well uses the GitHub OIDC role from infra/terraform
      # (repository variables AWS_ROLE_ARN and AWS_REGION). Without them the
      # steps are skipped, so forks still build.
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        id: ecr
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image to ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag "$IMAGE" "$REGISTRY/$IMAGE"
          docker push "$REGISTRY/$IMAGE"

  # GitOps hand-off: CI never touches the cluster. It records the new image tag
  # in Git, and Argo CD (infra/argocd) notices the commit and rolls it out.
  release:
    name: Record image tag for Argo CD
    runs-on: ubuntu-latest
    needs: [images, e2e, dependency-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Point the GitOps values at this commit's images
        run: |
          cat > infra/helm/reelwalk/values-gitops.yaml <<EOF
          # Written by the "release" job in .github/workflows/ci.yml. Do not edit
          # by hand: to roll back, revert the commit that changed this file.
          web:
            image:
              repository: ghcr.io/leighatkins/reelwalk-web
              tag: "${GITHUB_SHA}"
          worker:
            image:
              repository: ghcr.io/leighatkins/reelwalk-worker
              tag: "${GITHUB_SHA}"
          EOF
      # A push made with GITHUB_TOKEN does not start another workflow run, so
      # this commit cannot loop.
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/helm/reelwalk/values-gitops.yaml
          git commit -m "release: deploy ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reelwalk/e2e exec playwright install --with-deps chromium
      - name: Start the stack
        run: |
          docker compose up -d --build
          curl --fail --silent --retry 60 --retry-delay 2 --retry-all-errors http://localhost:8080/api/ready
      - run: pnpm e2e
        env:
          CI: "true"
      - name: Collect logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure
          path: |
            compose-logs.txt
            e2e/playwright-report
            e2e/test-results
