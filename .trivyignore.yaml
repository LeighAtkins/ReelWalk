# Accepted Trivy findings. Each entry says why it is accepted.
misconfigurations:
  - id: DS-0002
    paths:
      - "apps/editor/Dockerfile"
      - "infra/nginx/Dockerfile"
    statement: >-
      Stock nginx images used only by the local Compose stack. They are not
      part of the Kubernetes deployment. Switching to nginx-unprivileged is
      tracked as follow-up work.
  - id: DS-0002
    paths:
      - "apps/worker/Dockerfile.b4chrome"
    statement: Backup of an earlier Dockerfile, not built by anything.
  - id: DS-0002
    paths:
      - "infra/splat/Dockerfile"
    statement: >-
      Local GPU experiment image built on nerfstudio's image, which runs as
      root and writes its outputs to bind mounts. It is run by hand on a
      workstation and is not part of the Compose stack or the Kubernetes
      deployment.

  # infra/terraform: both findings are cost decisions for a portfolio
  # deployment, not oversights.
  - id: AWS-0011
    paths:
      - "infra/terraform/media.tf"
      - "media.tf"
    statement: >-
      The CloudFront distribution serves finished videos (GET/HEAD only) from
      a bucket that CloudFront alone may read. A WAF adds a fixed monthly fee
      for no exposed application logic; revisit when the web app itself sits
      behind CloudFront.
  - id: AWS-0132
    paths:
      - "infra/terraform/media.tf"
      - "media.tf"
    statement: >-
      SSE-S3 (AES256) is enabled. A customer-managed KMS key would add a key
      fee plus a request fee on every upload and render; the media is not
      sensitive enough to justify it.

vulnerabilities:
  # tinypool 1.1.1 is vendored (pre-compiled) into @rspack/core, which
  # @remotion/bundler depends on, so it cannot be bumped with a pnpm override.
  # The gadget needs attacker-controlled worker/run() options; rspack passes
  # its own fixed options and no user input reaches it. Drop this when
  # Remotion ships an @rspack/core with tinypool >= 2.1.2.
  - id: CVE-2026-104848
    paths:
      - "**/@rspack/core/compiled/tinypool/package.json"
    statement: Vendored copy inside @rspack/core; options are not user-controlled.
  - id: CVE-2026-104849
    paths:
      - "**/@rspack/core/compiled/tinypool/package.json"
    statement: Vendored copy inside @rspack/core; options are not user-controlled.
