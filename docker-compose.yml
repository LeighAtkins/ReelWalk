services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reelwalk
      POSTGRES_PASSWORD: reelwalk
      POSTGRES_DB: reelwalk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelwalk -d reelwalk"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Runtime secrets live only in the ignored .env file.
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reelwalk:reelwalk@postgres:5432/reelwalk
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: /media
      CLOUDFRONT_BASE_URL: /media/reelwalk-dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    # Runtime secrets live only in the ignored .env file.
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reelwalk:reelwalk@postgres:5432/reelwalk
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: /media
      CLOUDFRONT_BASE_URL: /media/reelwalk-dev
      RENDER_PACKAGE_DIR: /workspace/packages/render
      WORKSPACE_DIR: /workspace
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  editor:
    build:
      context: .
      dockerfile: apps/editor/Dockerfile
    restart: unless-stopped

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_started
      editor:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
