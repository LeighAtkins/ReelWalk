# Local stack. MinIO stands in for S3 and ElasticMQ for SQS, so the app talks
# to both through the real AWS SDK and only the endpoints differ in production.

x-app-env: &app-env
  DATABASE_URL: postgresql://reelwalk:reelwalk@postgres:5432/reelwalk
  AWS_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT_URL: http://minio:9000
  # Presigned URLs are opened by the browser, so they are signed for the host-side address.
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-reelwalk-dev}
  S3_FORCE_PATH_STYLE: "true"
  SQS_ENDPOINT_URL: http://elasticmq:9324
  SQS_QUEUE_URL: http://elasticmq:9324/000000000000/render-jobs
  SQS_DLQ_URL: http://elasticmq:9324/000000000000/render-jobs-dlq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reelwalk
      POSTGRES_PASSWORD: reelwalk
      POSTGRES_DB: reelwalk
    ports:
      - "5432:5432"
    volumes:
      # New volume name: the Prisma schema replaced the FastAPI-era tables.
      - postgres-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelwalk -d reelwalk"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # MinIO no longer publishes images on Docker Hub; Chainguard builds it from source.
    image: cgr.dev/chainguard/minio:latest
    # The image runs as a non-root user, but the volume may have been created by a root one.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Creates the bucket. Retries until MinIO accepts connections.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    restart: on-failure
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    command: ["--config-dir", "/tmp/.mc", "mb", "--ignore-existing", "local/${S3_BUCKET:-reelwalk-dev}"]

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.12
    ports:
      - "9324:9324"
    configs:
      - source: elasticmq
        target: /opt/elasticmq.conf

  # One-shot: applies Prisma migrations and the idempotent seed, then exits.
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: reelwalk-worker
    working_dir: /workspace/packages/db
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node_modules/.bin/tsx prisma/seed.ts"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  # Loads openly licensed 360 photos and home videos into the media library
  # and creates sample reels. Run on demand; safe to run again:
  #   docker compose run --rm import-library
  import-library:
    image: reelwalk-worker
    profiles: ["tools"]
    command: ["node_modules/.bin/tsx", "src/import-library.ts"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # Imports home tours in the Zillow Indoor Dataset format from ./data/zind
  # (not in the repository): 360 photos located on a floor plan.
  #   docker compose run --rm import-zind
  import-zind:
    image: reelwalk-worker
    profiles: ["tools"]
    command: ["node_modules/.bin/tsx", "src/import-zind.ts"]
    environment: *app-env
    volumes:
      - ./data/zind:/data/zind:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: reelwalk-worker
    environment:
      <<: *app-env
      RENDER_RETRY_BACKOFF_SECONDS: ${RENDER_RETRY_BACKOFF_SECONDS:-5}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: reelwalk-web
    environment:
      <<: *app-env
      CLOUDFRONT_BASE_URL: ""
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started

  editor:
    build:
      context: .
      dockerfile: apps/editor/Dockerfile
    restart: unless-stopped

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      editor:
        condition: service_started

configs:
  elasticmq:
    content: |
      include classpath("application.conf")
      node-address {
        protocol = http
        host = elasticmq
        port = 9324
        context-path = ""
      }
      rest-sqs {
        enabled = true
        bind-port = 9324
        bind-hostname = "0.0.0.0"
        sqs-limits = strict
      }
      queues {
        render-jobs {
          defaultVisibilityTimeout = 120 seconds
          # After 3 failed receives a message moves to the dead-letter queue.
          # Keep in step with RENDER_MAX_ATTEMPTS.
          deadLettersQueue {
            name = "render-jobs-dlq"
            maxReceiveCount = 3
          }
        }
        render-jobs-dlq { }
      }

volumes:
  postgres-data-v2:
  minio-data:
