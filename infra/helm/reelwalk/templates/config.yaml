apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reelwalk.fullname" . }}
  labels:
    {{- include "reelwalk.labels" . | nindent 4 }}
  annotations:
    # Argo CD: config exists before the migration Job and the Deployments.
    argocd.argoproj.io/sync-wave: "-2"
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- if .Values.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reelwalk.fullname" . }}
  labels:
    {{- include "reelwalk.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reelwalk.fullname" . }}
  labels:
    {{- include "reelwalk.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- with .Values.imagePullSecrets }}
# Every pod runs as this ServiceAccount, so the pull secrets are set once here.
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
