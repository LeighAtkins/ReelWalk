apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reelwalk.fullname" . }}-worker
  labels:
    {{- include "reelwalk.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "reelwalk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "reelwalk.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include "reelwalk.configChecksum" . }}
    spec:
      serviceAccountName: {{ include "reelwalk.fullname" . }}
      securityContext:
        {{- include "reelwalk.podSecurityContext" . | nindent 8 }}
      # On SIGTERM the worker stops polling and finishes its current render.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8081
          env:
            {{- include "reelwalk.homeEnv" . | nindent 12 }}
          envFrom:
            {{- include "reelwalk.envFrom" . | nindent 12 }}
          # No readiness probe: workers pull from SQS and receive no traffic.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            {{- include "reelwalk.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            # Render scratch space: downloaded input, webpack bundle, output MP4.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        # Chrome needs more shared memory than the 64 MB a container gets by default.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
{{- if .Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "reelwalk.fullname" . }}-worker
  labels:
    {{- include "reelwalk.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "reelwalk.fullname" . }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
