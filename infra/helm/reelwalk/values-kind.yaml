# Local kind cluster. MinIO stands in for S3 and ElasticMQ for SQS; both are
# deployed by infra/k8s/local, outside this chart, because in production they
# are AWS services and not part of the application release.

web:
  replicas: 2
  # metrics-server is installed by infra/kind/metrics-server.sh.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  service:
    type: NodePort
    # Mapped to http://localhost:8081 by infra/kind/cluster.yaml.
    nodePort: 30080

worker:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

# Postgres, MinIO and ElasticMQ run next to the app here (infra/k8s/local).
networkPolicy:
  egressToPods:
    - app: postgres
    - app: minio
    - app: elasticmq
  # The internet rule is 0.0.0.0/0, and kindnet matches pod addresses against
  # ipBlock too, so without these the app could reach every pod in the cluster
  # (tested: web could open Argo CD's server). Pods and Services here come from
  # kind's defaults (cluster-cidr and service-cluster-ip-range).
  blockedEgressCidrs:
    - 169.254.169.254/32
    - 10.244.0.0/16
    - 10.96.0.0/16

config:
  S3_BUCKET: reelwalk-dev
  S3_FORCE_PATH_STYLE: "true"
  S3_ENDPOINT_URL: http://minio:9000
  # The browser reaches MinIO through the NodePort mapped to localhost:9100.
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9100
  SQS_ENDPOINT_URL: http://elasticmq:9324
  SQS_QUEUE_URL: http://elasticmq:9324/000000000000/render-jobs
  SQS_DLQ_URL: http://elasticmq:9324/000000000000/render-jobs-dlq
  RENDER_RETRY_BACKOFF_SECONDS: "5"

secret:
  create: true
  # Throwaway credentials for the local dependencies only.
  values:
    DATABASE_URL: postgresql://reelwalk:reelwalk@postgres:5432/reelwalk
    S3_ACCESS_KEY_ID: minioadmin
    S3_SECRET_ACCESS_KEY: minioadmin
    DEMO_PASSWORD: reelwalk-demo
