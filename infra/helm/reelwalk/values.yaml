# Defaults target a real cluster with AWS S3 and SQS.
# values-kind.yaml overrides them for the local kind cluster.

web:
  image:
    repository: reelwalk-web
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 2
  service:
    type: ClusterIP
    port: 80
    # Only used when type is NodePort.
    nodePort: null
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # CPU-based HorizontalPodAutoscaler; replicas is then the HPA's job.
  # Needs metrics-server in the cluster.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  # Keeps this many web pods up during voluntary disruptions (node drains,
  # cluster upgrades). Only rendered when more than one pod can run.
  podDisruptionBudget:
    minAvailable: 1

worker:
  image:
    repository: reelwalk-worker
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  # A render holds its pod until it finishes; give it time before SIGKILL.
  terminationGracePeriodSeconds: 300
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  # CPU-based HorizontalPodAutoscaler. Needs metrics-server in the cluster.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Deny-by-default traffic rules for the release's pods (templates/networkpolicy.yaml).
networkPolicy:
  enabled: true
  # Who may reach the web pods. Empty: anyone, which is what a NodePort or a
  # cloud load balancer needs. Narrow it to the ingress controller's pods
  # when there is one, e.g.
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
  webIngressFrom: []
  # Pods in the same namespace the app may call (by their labels). Empty in
  # production, where the database, S3 and SQS are outside the cluster.
  egressToPods: []
  # Destinations the app may never reach. The cloud metadata endpoint holds
  # the node's credentials; nothing in ReelWalk needs it.
  blockedEgressCidrs:
    - 169.254.169.254/32

# Runs `prisma migrate deploy` and the idempotent seed, using the worker image.
migrate:
  enabled: true

ingress:
  enabled: false
  className: ""
  host: reelwalk.example.com
  annotations: {}
  # true: terminate TLS at the ingress with a certificate in tlsSecretName
  # (cert-manager fills it when the annotations ask for an issuer).
  tls: false
  tlsSecretName: ""

# Secrets for pulling from a private registry, e.g. [{name: ghcr-pull}].
# Not needed for public images, or for ECR on EKS (the node role can pull).
imagePullSecrets: []

serviceAccount:
  # On EKS, annotate with eks.amazonaws.com/role-arn so pods get AWS access
  # through IRSA instead of static keys.
  annotations: {}

# Non-secret settings, rendered into a ConfigMap and injected as env vars.
config:
  # Values from `terraform output` in infra/terraform.
  AWS_REGION: us-east-2
  S3_REGION: us-east-2
  S3_BUCKET: reelwalk-media-prod-734329326838-us-east-2-an
  S3_FORCE_PATH_STYLE: "false"
  # Empty means the real AWS endpoints.
  S3_ENDPOINT_URL: ""
  S3_PUBLIC_ENDPOINT_URL: ""
  SQS_ENDPOINT_URL: ""
  SQS_QUEUE_URL: https://sqs.us-east-2.amazonaws.com/734329326838/reelwalk-render-jobs
  SQS_DLQ_URL: https://sqs.us-east-2.amazonaws.com/734329326838/reelwalk-render-jobs-dlq
  CLOUDFRONT_BASE_URL: https://dh5xvp6apljoh.cloudfront.net
  # Public address of the web app (share links, OAuth callbacks). Cookies are
  # secure when it starts with https.
  APP_URL: ""
  # Must equal the queue's redrive maxReceiveCount.
  RENDER_MAX_ATTEMPTS: "3"
  RENDER_VISIBILITY_SECONDS: "120"
  RENDER_HEARTBEAT_SECONDS: "20"
  RENDER_STALE_SECONDS: "60"
  RENDER_RETRY_BACKOFF_SECONDS: "15"
  # How often a worker sends outbox messages the web app could not send itself.
  OUTBOX_POLL_SECONDS: "5"
  # Browser tabs per render. Keep requests.cpu in step when raising it.
  RENDER_CONCURRENCY: "4"

secret:
  # true: the chart creates the Secret from `values` (local development only).
  # false: reference a Secret managed elsewhere (External Secrets, Sealed Secrets).
  create: false
  existingSecret: reelwalk-secrets
  values: {}
  #  DATABASE_URL: postgresql://user:password@host:5432/reelwalk
  #  S3_ACCESS_KEY_ID: ""
  #  PIXABAY_API_KEY: ""      # stock footage search, optional
  #  META_APP_ID: ""         # one-tap Instagram posting, optional
  #  META_APP_SECRET: ""
  #  DEMO_PASSWORD: ""       # only for a demo deployment
  #  S3_SECRET_ACCESS_KEY: ""
