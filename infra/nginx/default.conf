# ReelWalk nginx config — dynamic DNS re-resolution for container upstreams.
# Using variables in proxy_pass forces nginx to re-resolve via the resolver
# directive at the configured interval, preventing stale-upstream 502s
# when web/media containers are recreated with new IPs.

server {
  listen 80;
  server_name _;

  client_max_body_size 2048m;

  # Docker embedded DNS — re-resolve every 10s
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;

  # --- MinIO / S3 media ---
  location /media/ {
    set $upstream_minio minio:9000;
    rewrite ^/media/(.*)$ /$1 break;
    proxy_pass http://$upstream_minio;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- Editor (Vite static build) — auth gated ---
  location /editor/ {
    auth_basic "ReelWalk";
    auth_basic_user_file /etc/nginx/.htpasswd;

    set $upstream_editor editor:80;
    proxy_pass http://$upstream_editor;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- Web (Next.js) ---
  location / {
    set $upstream_web web:3000;
    proxy_pass http://$upstream_web;

    proxy_http_version 1.1;
    # $http_host keeps the port. Server Actions compare the Origin header
    # with the forwarded host and reject the request if they differ.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
