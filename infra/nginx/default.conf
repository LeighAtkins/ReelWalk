# ReelWalk nginx: the single browser-facing origin for the Docker Compose stack.
#
# Upstreams are resolved by nginx in the background (`resolve`), not per
# request. The previous setup put a variable in proxy_pass, which made nginx
# look up the container name on every request once its 10 s cache expired;
# under load on Docker Desktop those lookups stalled requests by exact
# multiples of 10 s. Background resolution still follows containers that are
# recreated with a new IP, and keepalive reuses connections to the app.

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

upstream web {
  zone web 64k;
  server web:3000 resolve;
  keepalive 32;
}

upstream minio {
  zone minio 64k;
  server minio:9000 resolve;
  keepalive 16;
}

upstream editor {
  zone editor 64k;
  server editor:80 resolve;
  keepalive 4;
}

# Only real WebSocket requests are upgraded; everything else keeps the
# upstream connection open for reuse.
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" "";
}

server {
  listen 80;
  server_name _;

  client_max_body_size 2048m;

  # --- MinIO / S3 media ---
  location /media/ {
    rewrite ^/media/(.*)$ /$1 break;
    proxy_pass http://minio;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- Editor (Vite static build) — auth gated ---
  location /editor/ {
    auth_basic "ReelWalk";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://editor;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- Web (Next.js) ---
  location / {
    proxy_pass http://web;

    proxy_http_version 1.1;
    # $http_host keeps the port. Server Actions compare the Origin header
    # with the forwarded host and reject the request if they differ.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
